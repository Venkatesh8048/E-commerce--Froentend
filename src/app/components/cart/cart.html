<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="bi bi-cart-fill text-primary me-2"></i>
                My Cart
            </h2>

            <p class="text-muted mb-0">
                Your selected products
            </p>
        </div>

        <!-- SEARCH -->
        <div class="search-container mt-3 mt-md-0">

            <div class="input-group search-box">

                <span class="input-group-text bg-white border-0">
                    <i class="bi bi-search text-muted"></i>
                </span>

                <input type="text" class="form-control border-0" placeholder="Search products..."
                    [(ngModel)]="searchText" (input)="searchProducts()">

            </div>

        </div>

    </div>

    <!-- CART LIST -->
    <div class="row g-4">

        <div class="col-lg-6" *ngFor="let row of dataSource">

            <div class="cart-card">

                <!-- TOP -->
                <div class="card-top">

                    <!-- IMAGE -->
                    <div class="product-image-wrapper">

                        <img *ngIf="row.product?.image" [src]="getImageUrl(row.product.image)" class="product-image">

                    </div>

                    <!-- DETAILS -->
                    <div class="product-info">

                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">

                            <div>

                                <h4 class="product-title">
                                    {{row.product.name}}
                                </h4>

                                <p class="text-muted small mb-2">
                                    Product ID : {{row.product.id}}
                                </p>

                            </div>

                            <div class="price-badge">
                                ₹{{row.totalPrice}}
                            </div>

                        </div>

                        <!-- INFO -->
                        <div class="info-list">

                            <div class="info-item">
                                <i class="bi bi-person-circle"></i>
                                {{row.user.username}}
                            </div>

                        </div>

                        <!-- QUANTITY CONTROL -->
                        <div class="quantity-control">

                            <button class="qty-btn minus-btn" (click)="removeProductQuantity(row.id)">
                                <i class="bi bi-dash"></i>
                            </button>

                            <div class="qty-value">
                                {{row.quantity}}
                            </div>

                            <button class="qty-btn plus-btn" (click)="addProductQuantity(row.id)">
                                <i class="bi bi-plus"></i>
                            </button>

                        </div>

                        <!-- BUTTONS -->
                        <div class="button-group">

                            <button class="btn btn-primary custom-btn" (click)="placedOrder(row.id)">

                                <i class="bi bi-bag-check-fill me-2"></i>
                                Place Order

                            </button>

                            <button class="btn btn-outline-danger custom-btn" (click)="deleteCart(row.id)">

                                <i class="bi bi-trash-fill me-2"></i>
                                Remove

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
