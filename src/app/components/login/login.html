<div class="login-container d-flex align-items-center justify-content-center">
  <div class="card login-card shadow-lg border-0">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">VIBE<span class="text-primary">STORE</span></h2>
        <p class="text-muted">Sign in to continue</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label for="username" class="form-label fw-bold">Username</label>
          <input type="text" 
                 class="form-control" 
                 id="username"
                 placeholder="Enter username" 
                 formControlName="username"
                 [ngClass]="{ 'is-invalid': submitted && f['username'].errors }">
          
          <div *ngIf="submitted && f['username'].errors" class="invalid-feedback text-start">
            <div *ngIf="f['username'].errors['required']">Username is required</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold" for="password-input">Password</label>
          <div class="position-relative auth-pass-inputgroup">
            <input [type]="fieldTextType ? 'text' : 'password'"
                   class="form-control pe-5 password-input" 
                   placeholder="Enter password"
                   id="password-input" 
                   formControlName="password"
                   [ngClass]="{ 'is-invalid': submitted && f['password'].errors }">
            
            <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted" 
                    type="button" 
                    (click)="toggleFieldTextType()">
              <i class="bi" [ngClass]="{'bi-eye-fill': !fieldTextType, 'bi-eye-slash-fill': fieldTextType}"></i>
            </button>

            <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
              <span *ngIf="f['password'].errors['required']">Password is required</span>
            </div>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small mt-2">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage }}
        </div>

        <div class="mt-4">
          <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Login</button>
        </div>

        <div class="text-center mt-4">
          <p class="small text-muted mb-0">New here? <a href="#" class="text-primary text-decoration-none fw-bold" routerLink="/register" routerLinkActive="active">Create Account</a></p>
        </div>
      </form>

    </div>
  </div>
</div>
